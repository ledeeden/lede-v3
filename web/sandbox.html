<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><style>html,body{margin:0;background:#15161a;color:#ecedef;font:13px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}body{padding:18px;box-sizing:border-box}*{box-sizing:border-box}h3{font-size:15px;font-weight:500;margin:0 0 12px}p{margin:0 0 12px}button,input,select{font:inherit}button:focus-visible{outline:2px solid #9db8ff;outline-offset:3px}</style></head><body><div id="root"></div><script>
let nonce=null,cleanup=null;const root=document.querySelector('#root');

window.h=function(tag,attrs,...children){if(typeof tag==='function')return tag({...attrs,children});const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='style'&&typeof v==='object')Object.assign(n.style,v);else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='className')n.className=v;else if(k!=='ref'&&v!=null&&v!==false)n.setAttribute(k,v===true?'':String(v));}for(const c of children.flat(Infinity))if(c!==null&&c!==undefined&&c!==false)n.append(c instanceof Node?c:document.createTextNode(String(c)));if(typeof attrs?.ref==='function')attrs.ref(n);return n;};
